[package]
name = "gtk-reader"
version = "0.1.0"
edition = "2021"
description = "Spike: native GTK4 frontend for the Weland .wld format"

[dependencies]
weland = { path = ".." }
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
gtk4 = { version = "0.11", package = "gtk4", features = ["v4_10"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5"
# Native microphone capture for voice notes — see src/recording.rs, ported
# near-verbatim from reader/src-tauri/src/recording.rs.
cpal = "0.15"
ogg-opus = "0.1"
# Embeds the vendored reading fonts (resources/fonts/*.woff2, self-hosted
# per CLAUDE.md — no runtime network calls) into the binary as one directory
# tree, rather than 39 individual include_bytes! lines.
include_dir = "0.7"
# v1_5 (which cascades down through v1_4, so nothing already used regresses)
# for AdwPreferencesDialog -- the settings menu's home since it stopped
# fitting comfortably in a popover. System libadwaita here is 1.9.3, so
# there's no runtime version risk.
libadwaita = { version = "0.9", features = ["v1_5"] }

[dev-dependencies]
tempfile = "3.17"
