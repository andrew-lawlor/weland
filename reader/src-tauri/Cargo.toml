[package]
name = "weland-reader"
version = "0.1.0"
description = "Reference reader client for the Weland (.wld) ebook standard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
weland = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
whoami = "1"
