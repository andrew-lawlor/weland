[package]
name = "weland"
version = "0.1.0"
edition = "2021"
description = "A high-performance compiler and toolkit for the Weland (.wld) ebook format"
authors = ["Andrew"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
scraper = "0.22"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
indicatif = "0.17"
colored = "3.0"
mime_guess = "2.0"
percent-encoding = "2.3"

[dev-dependencies]
tempfile = "3.17"
